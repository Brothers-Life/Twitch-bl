<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BL Studio Widget</title>
<!--
  Un widget par source navigateur OBS. Réglages dans l'URL (ou via le dock « Configurateur BL ») :
    commun      theme=sunset|neon|lspd|ems|gold|gang|minimal   c1/c2/c3=couleur (sans #)
                style=carte|verre|neon|gta|minimal|plein   (look du widget)
    countdown   min=5  done=J'arrive !  bar=1
    music       label=En écoute
    clock       date=1
    badge       title=MA CHAÎNE  sub=Live  dot=1  logo=1
    chat        channel=pseudo_twitch  max=8  fade=30 (secondes, 0 = jamais)
    ticker      msgs=Message 1|Message 2|...  speed=1
    socials     items=TWITCH:pseudo|TIKTOK:@pseudo|DISCORD:discord.gg/xxx  every=5
    perso       nom=Pablo Reed  metier=Concessionnaire  info=Los Santos
    goal        label=Objectif followers  cur=120  max=200
    camframe    nom=Pablo  (cadre à poser par-dessus la webcam)
  Le widget remplit toute la source : redimensionne-la dans OBS pour changer sa taille.
-->
<script src="theme.js"></script>
<script src="hub-client.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; color: #fff;
    font-family: var(--font-body); }
  body { display: flex; align-items: center; justify-content: center; }
  .hide { display: none !important; }

  .chip {
    width: 100%; height: 100%; display: flex; align-items: center; gap: 6vh; padding: 0 9vh;
    animation: in .6s cubic-bezier(.2,.9,.2,1.1);
  }
  @keyframes in { from { opacity: 0; transform: translateX(-6%); } }
  .label { font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--c2); }

  /* compte à rebours */
  .countdown { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
  .countdown b { font-weight: 700; font-size: 62vh; line-height: 1; font-variant-numeric: tabular-nums; }
  .countdown .bar { width: 70%; height: 4vh; background: rgba(255,255,255,.15); border-radius: 2vh; overflow: hidden; }
  .countdown .bar i { display: block; height: 100%; width: 0; background: var(--c2); }

  /* musique */
  .music .art { flex: none; height: 64vh; aspect-ratio: 1; border-radius: 4vh; background: var(--c2);
    display: flex; align-items: flex-end; gap: 4%; padding: 14vh 12vh; }
  .music .art i { flex: 1; background: var(--bg2); border-radius: 1vh; animation: eq 1.1s ease-in-out infinite; }
  .music .art i:nth-child(2) { animation-delay: -.35s; } .music .art i:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%,100% { height: 30%; } 50% { height: 100%; } }
  .txt { min-width: 0; display: flex; flex-direction: column; gap: 2vh; }
  .music small { font-size: 15vh; }
  .music strong { font-size: 27vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music span { font-size: 20vh; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* horloge */
  .clock { flex-direction: column; justify-content: center; align-items: flex-end; gap: 0; }
  .clock b { font-size: 48vh; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 16vh; }

  /* badge serveur */
  .badge img { flex: none; height: 76vh; aspect-ratio: 1; border-radius: 50%; }
  .badge b { font-family: var(--font-title); font-weight: 400; font-size: 34vh; line-height: 1; letter-spacing: .03em; color: var(--c1); white-space: nowrap; }
  .badge small { display: flex; align-items: center; gap: 4vh; font-size: 16vh; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
  .dot { width: 11vh; height: 11vh; border-radius: 50%; background: #ff3030; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* chat Twitch : messages empilés en bas, taille relative à la largeur */
  .chat { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 1.2vw; padding: 2vw; }
  body.w-chat { --u: .16vw; }
  .msg { padding: 1.4vw 2.2vw;
    font-size: 3.6vw; line-height: 1.3; animation: in .4s ease-out; transition: opacity 1s; word-wrap: break-word; }
  .msg b { margin-right: 1vw; }
  .msg.old { opacity: 0; }
  .chat .empty { font-size: 3.4vw; color: rgba(255,255,255,.6); text-align: center; }

  /* bandeau défilant */
  .ticker { width: 100%; height: 100%; display: flex; align-items: center; overflow: hidden;
    background: rgba(12,8,6,.9); border-top: 5vh solid var(--c2); }
  .ticker .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 6vh; background: var(--c2); color: var(--bg2);
    font-family: var(--font-title); font-size: 42vh; letter-spacing: .05em; z-index: 1; }
  .ticker .track { display: flex; white-space: nowrap; animation: scroll linear infinite; }
  .ticker .track span { font-size: 40vh; font-weight: 600; padding: 0 10vh; }
  .ticker .track span::after { content: "◆"; color: var(--c2); margin-left: 20vh; font-size: 24vh; vertical-align: middle; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* réseaux qui défilent */
  .socials .net { flex: none; padding: 4vh 6vh; border-radius: 3vh; background: var(--c2); color: var(--bg2); font-weight: 800; font-size: 18vh; letter-spacing: .12em; }
  .socials strong { font-size: 30vh; font-weight: 700; white-space: nowrap; }
  .socials .swap { animation: swap .5s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(30%); } }

  /* carte personnage RP */
  .perso { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2vh; }
  .perso small { font-size: 12vh; }
  .perso strong { font-family: var(--font-title); font-weight: 400; font-size: 30vh; line-height: 1; color: var(--c1); letter-spacing: .03em; }
  .perso span { font-size: 17vh; color: var(--sub); }

  /* objectif */
  .goal { flex-direction: column; align-items: stretch; justify-content: center; gap: 5vh; }
  .goal .row { display: flex; justify-content: space-between; align-items: baseline; }
  .goal small { font-size: 15vh; }
  .goal b { font-size: 22vh; font-variant-numeric: tabular-nums; }
  .goal .bar { height: 14vh; border-radius: 7vh; background: rgba(255,255,255,.12); overflow: hidden; }
  .goal .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--c3), var(--c2), var(--c1)); border-radius: 7vh; transition: width 1s; }

  /* cadre webcam : coins + étiquette, centre transparent */
  .camframe { position: relative; width: 100%; height: 100%; }
  .camframe .edge { position: absolute; inset: 1.5vmin; border: .5vmin solid rgba(255,255,255,.15); border-radius: 2vmin; }
  .camframe .c { position: absolute; width: 14vmin; height: 14vmin; border: 1.6vmin solid var(--c2); }
  .camframe .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 3vmin; }
  .camframe .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 3vmin; }
  .camframe .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 3vmin; }
  .camframe .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 3vmin; }
  .camframe .name { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 40%); padding: 1.5vmin 5vmin;
    background: var(--c2); color: var(--bg2); font-family: var(--font-title); font-size: 7vmin; letter-spacing: .05em; border-radius: 1.5vmin; white-space: nowrap; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const theme = blTheme(q);
  const w = q.get("w") || "music";
  blStyle(q);
  document.body.classList.add(`w-${w}`);
  const on = (k, d = "1") => (q.get(k) ?? d) !== "0";
  const get = (k, d) => q.get(k) ?? d;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);

  const html = {
    countdown: `<div class="countdown"><b id="t">--:--</b>${on("bar") ? `<div class="bar"><i id="bar"></i></div>` : ""}</div>`,
    music: `<div class="chip music hide" id="box"><div class="art"><i></i><i></i><i></i></div>
             <div class="txt"><small class="label">${esc(get("label", "En écoute"))}</small><strong id="title"></strong><span id="artist"></span></div></div>`,
    clock: `<div class="chip clock"><b id="clock">--:--</b>${on("date") ? `<small class="label" id="date"></small>` : ""}</div>`,
    badge: `<div class="chip badge">${on("logo") ? `<img src="logo.png" alt="">` : ""}
             <div class="txt"><b>${esc(get("title", "MA CHAÎNE"))}</b>
             <small>${on("dot") ? `<span class="dot"></span>` : ""}${esc(get("sub", "Live RP"))}</small></div></div>`,
    chat: `<div class="chat" id="chat"></div>`,
    ticker: `<div class="ticker"><div class="tag">${esc(get("tag", "INFO"))}</div><div class="track" id="track"></div></div>`,
    socials: `<div class="chip socials" id="soc"></div>`,
    perso: `<div class="chip perso"><small class="label">${esc(get("titre", "Personnage"))}</small>
             <strong>${esc(get("nom", "Mon perso"))}</strong><span>${esc(get("metier", "Métier"))}${get("info", "") ? " · " + esc(get("info")) : ""}</span></div>`,
    goal: `<div class="chip goal"><div class="row"><small class="label">${esc(get("label", "Objectif followers"))}</small>
             <b>${esc(get("cur", "0"))} / ${esc(get("max", "100"))}</b></div><div class="bar"><i id="gbar"></i></div></div>`,
    camframe: `<div class="camframe"><div class="edge"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
             ${get("nom", "") ? `<div class="name">${esc(get("nom"))}</div>` : ""}</div>`,
  };
  document.body.innerHTML = html[w] || "";

  if (w === "countdown") {
    // OBS recharge la source à chaque affichage de la scène : le compte repart de zéro
    const total = Math.max(0, parseFloat(get("min", "5"))) * 60000;
    const end = Date.now() + total, done = get("done", "00:00");
    const tick = () => {
      const left = Math.max(0, end - Date.now()), s = Math.ceil(left / 1000);
      $("t").textContent = left ? `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : done;
      if ($("bar")) $("bar").style.width = `${total ? 100 - left / total * 100 : 100}%`;
    };
    tick(); setInterval(tick, 250);
  }

  if (w === "clock") {
    const tick = () => {
      const d = new Date();
      $("clock").textContent = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      if ($("date")) $("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
    };
    tick(); setInterval(tick, 1000);
  }

  if (w === "music") {
    // nowplaying.js est réécrit toutes les 2 s par le script OBS brotherslife.lua
    const poll = () => {
      const s = document.createElement("script");
      s.src = `nowplaying.js?t=${Date.now()}`;
      s.onload = s.onerror = () => {
        s.remove();
        const np = window.__NP, playing = np && np.playing;
        $("box").classList.toggle("hide", !playing);
        if (playing) { $("title").textContent = np.title; $("artist").textContent = np.artist; }
      };
      document.head.appendChild(s);
    };
    poll(); setInterval(poll, 2000);
  }

  if (w === "chat") {
    // chat Twitch en lecture anonyme (aucun compte nécessaire)
    const box = $("chat"), channel = get("channel", "").toLowerCase().replace(/^#/, "");
    const max = parseInt(get("max", "8")), fade = parseFloat(get("fade", "30"));
    if (!channel) {
      box.innerHTML = `<div class="empty">Ajoute ton pseudo Twitch : channel=…</div>`;
    } else {
      const connect = () => {
        const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
        ws.onopen = () => {
          ws.send("CAP REQ :twitch.tv/tags");
          ws.send(`NICK justinfan${Math.floor(Math.random() * 1e5)}`);
          ws.send(`JOIN #${channel}`);
        };
        ws.onmessage = e => {
          for (const line of e.data.split("\r\n")) {
            if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); continue; }
            const m = line.match(/^(?:@(\S+) )?:(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
            if (!m) continue;
            const tags = Object.fromEntries((m[1] || "").split(";").map(t => t.split("=")));
            const div = document.createElement("div");
            div.className = "msg";
            div.innerHTML = `<b style="color:${tags.color || theme.c2}">${esc(tags["display-name"] || m[2])}</b>${esc(m[3])}`;
            box.appendChild(div);
            while (box.children.length > max) box.firstChild.remove();
            if (fade > 0) setTimeout(() => { div.classList.add("old"); setTimeout(() => div.remove(), 1000); }, fade * 1000);
          }
        };
        ws.onclose = () => setTimeout(connect, 5000);
      };
      connect();
    }
  }

  if (w === "ticker") {
    const msgs = get("msgs", "Bienvenue sur le live|N'oublie pas le follow|Tape !commandes dans le chat").split("|");
    const track = $("track");
    const once = msgs.map(m => `<span>${esc(m)}</span>`).join("");
    track.innerHTML = once + once;  // doublé pour une boucle sans saut
    requestAnimationFrame(() => {
      const px = track.scrollWidth / 2;
      track.style.animationDuration = `${px / (120 * parseFloat(get("speed", "1")))}s`;
    });
  }

  if (w === "socials") {
    const items = get("items", "TWITCH:ton_pseudo|TIKTOK:@ton_pseudo|YOUTUBE:@ton_pseudo")
      .split("|").map(s => { const i = s.indexOf(":"); return [s.slice(0, i), s.slice(i + 1)]; });
    let i = 0;
    const show = () => {
      const [net, handle] = items[i++ % items.length];
      $("soc").innerHTML = `<span class="net swap">${esc(net)}</span><strong class="swap">${esc(handle)}</strong>`;
    };
    show(); setInterval(show, parseFloat(get("every", "5")) * 1000);
  }

  if (w === "goal") {
    const cur = parseFloat(get("cur", "0")), max = parseFloat(get("max", "100")) || 1;
    requestAnimationFrame(() => $("gbar").style.width = `${Math.min(100, cur / max * 100)}%`);
  }
</script>
</body>
</html>
