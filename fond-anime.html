<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BL Studio - Fond animé</title>
<!--
  Fond animé (source navigateur OBS). Réglages dans l'URL (ou via le dock « Configurateur BL ») :
    theme=sunset|neon|lspd|ems|gold|gang|minimal
    anim=formes|bandes|braises|vagues|etoiles|pluie|hexa|aurore|synthwave|reseau|bokeh|circuit|tunnel|minimal     style d'animation
    font=impact|bebas|anton|…  (police, voir theme.js)
    traits=1  bandes=1  eclairs=1  grain=1        calques en plus (0 = off)
    vitesse=1  densite=1                           0.5 = lent / peu, 2 = rapide / beaucoup
    c1/c2/c3=couleur (sans #)
-->
<script src="theme.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0604; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  const T = blTheme(q);
  const on = k => (q.get(k) ?? "1") !== "0";
  const num = (k, d) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : d; };
  const ANIM = q.get("anim") || "formes";
  const SPEED = num("vitesse", 1), DENSITY = num("densite", 1);
  const COLORS = [T.c1, T.c2, T.c3];
  const rgba = blRgba;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W, H, U, grainTile, items = [];

  function makeGrain() {
    const t = document.createElement("canvas");
    t.width = t.height = 256;
    const g = t.getContext("2d"), img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.random() * 255;
      img.data[i + 3] = 14;
    }
    g.putImageData(img, 0, 0);
    return t;
  }

  // ---------- Style « formes » ----------
  const KINDS = ["tri", "square", "circle", "plus", "ring", "bar"];
  const Formes = {
    count: 38,
    make(anywhere) {
      const size = U * (0.025 + Math.random() ** 2 * 0.11);
      return { kind: pick(KINDS), x: rand(0, W), y: anywhere ? rand(0, H) : H + size * 2, size,
        vy: -rand(0.15, 0.65) * U / 1000, vx: rand(-0.08, 0.08) * U / 1000, rot: rand(0, 6.3), vr: rand(-6e-4, 6e-4),
        color: pick(COLORS), alpha: rand(0.25, 0.7), fill: Math.random() < 0.25 };
    },
    draw(s, dt) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
      if (s.y < -s.size * 2) Object.assign(s, this.make(false));
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.globalAlpha = s.alpha; ctx.strokeStyle = ctx.fillStyle = s.color;
      ctx.lineWidth = Math.max(2, s.size * 0.08);
      const r = s.size; let fill = s.fill;
      ctx.beginPath();
      switch (s.kind) {
        case "tri": ctx.moveTo(0, -r); ctx.lineTo(r * .87, r * .5); ctx.lineTo(-r * .87, r * .5); ctx.closePath(); break;
        case "square": ctx.rect(-r * .7, -r * .7, r * 1.4, r * 1.4); break;
        case "circle": ctx.arc(0, 0, r * .35, 0, 7); fill = true; break;
        case "ring": ctx.arc(0, 0, r * .8, 0, 7); break;
        case "plus": ctx.moveTo(-r * .6, 0); ctx.lineTo(r * .6, 0); ctx.moveTo(0, -r * .6); ctx.lineTo(0, r * .6); fill = false; break;
        case "bar": ctx.rect(-r, -r * .12, r * 2, r * .24); fill = true; break;
      }
      fill ? ctx.fill() : ctx.stroke();
      ctx.restore();
    },
  };

  // ---------- Style « bandes » : grandes bandes diagonales qui balaient l'écran ----------
  const Bandes = {
    count: 9,
    make(anywhere) {
      const w = U * rand(0.04, 0.28);
      return { x: anywhere ? rand(-W * .5, W * 1.2) : -W * .6 - w, w, v: rand(0.08, 0.3) * U / 1000,
        color: pick(COLORS), alpha: rand(0.08, 0.32) };
    },
    draw(b, dt) {
      b.x += b.v * dt;
      if (b.x > W * 1.4) Object.assign(b, this.make(false));
      const k = H * 0.55;  // inclinaison
      ctx.globalAlpha = b.alpha; ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.moveTo(b.x, H); ctx.lineTo(b.x + k, 0); ctx.lineTo(b.x + k + b.w, 0); ctx.lineTo(b.x + b.w, H); ctx.fill();
      ctx.globalAlpha = 1;
    },
  };

  // ---------- Style « braises » : particules qui montent en scintillant ----------
  const Braises = {
    count: 120,
    make(anywhere) {
      return { x: rand(0, W), y: anywhere ? rand(0, H) : H + 10, r: U * rand(0.0015, 0.006),
        vy: -rand(0.2, 0.9) * U / 1000, sway: rand(0, 6.3), color: pick(COLORS), life: rand(0.4, 1) };
    },
    draw(p, dt, t) {
      p.y += p.vy * dt; p.x += Math.sin(t * 1.5 + p.sway) * 0.25;
      if (p.y < -10) Object.assign(p, this.make(false));
      const a = p.life * (0.5 + 0.5 * Math.sin(t * 4 + p.sway)) * Math.min(1, p.y / (H * 0.3));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, rgba(p.color, a)); g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 7); ctx.fill();
    },
  };

  // ---------- Style « vagues » : lignes ondulantes empilées ----------
  const Vagues = {
    count: 14,
    make(_, i = items.length) {
      return { i, color: COLORS[i % 3], amp: rand(0.02, 0.07), freq: rand(1.2, 2.6), phase: rand(0, 6.3), sp: rand(0.2, 0.6) };
    },
    draw(l, dt, t) {
      const base = H * (0.25 + l.i / this.count * 0.7);
      ctx.strokeStyle = rgba(l.color, 0.12 + (l.i % 4) * 0.06);
      ctx.lineWidth = Math.max(1.5, U / 500);
      ctx.beginPath();
      for (let x = 0; x <= W; x += W / 80) {
        const y = base + Math.sin(x / W * Math.PI * l.freq + t * l.sp + l.phase) * H * l.amp
                       + Math.sin(x / W * Math.PI * 5 + t * l.sp * 1.7) * H * 0.008;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    },
  };

  // ---------- Style « etoiles » : hyper-espace, les étoiles fusent depuis le centre ----------
  const Etoiles = {
    count: 260,
    make(anywhere) {
      return { a: rand(0, 6.3), d: anywhere ? rand(0.02, 1) : rand(0.005, 0.05), v: rand(0.25, 0.9), color: pick(COLORS) };
    },
    draw(s, dt) {
      const prev = s.d;
      s.d *= 1 + 0.0009 * s.v * dt;
      if (s.d > 1.4) Object.assign(s, this.make(false));
      const R = Math.max(W, H) * 0.75, cx = W / 2, cy = H / 2;
      const x1 = cx + Math.cos(s.a) * prev * R, y1 = cy + Math.sin(s.a) * prev * R;
      const x2 = cx + Math.cos(s.a) * s.d * R, y2 = cy + Math.sin(s.a) * s.d * R;
      ctx.strokeStyle = rgba(s.color, Math.min(1, s.d * 1.4));
      ctx.lineWidth = Math.max(1, s.d * U / 260);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    },
  };

  // ---------- Style « pluie » : traits fins qui tombent en biais ----------
  const Pluie = {
    count: 220,
    make(anywhere) {
      return { x: rand(-W * 0.2, W), y: anywhere ? rand(0, H) : rand(-H * 0.3, -10), len: U * rand(0.02, 0.07),
        v: rand(0.9, 1.8) * U / 1000, color: Math.random() < 0.8 ? T.sub : pick(COLORS), a: rand(0.15, 0.5) };
    },
    draw(d, dt) {
      d.y += d.v * dt; d.x += d.v * dt * 0.18;
      if (d.y > H + d.len) Object.assign(d, this.make(false));
      ctx.strokeStyle = rgba(d.color, d.a);
      ctx.lineWidth = Math.max(1, U / 700);
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.len * 0.18, d.y + d.len); ctx.stroke();
    },
  };

  // ---------- Style « hexa » : grille d'hexagones qui s'allument par vagues ----------
  const Hexa = {
    single: true, count: 1,
    make() { return {}; },
    draw(_, dt, t) {
      const r = U / 16, w = r * Math.sqrt(3), h = r * 1.5;
      for (let row = -1, y = 0; y < H + r * 2; row++, y = row * h) {
        for (let col = -1; col * w < W + w; col++) {
          const x = col * w + (row % 2 ? w / 2 : 0);
          const wave = 0.5 + 0.5 * Math.sin(t * 1.2 - (x + y) / (U * 0.35));
          const glow = Math.pow(wave, 6);
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = Math.PI / 3 * i + Math.PI / 6;
            const px = x + Math.cos(a) * r * 0.92, py = y + Math.sin(a) * r * 0.92;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath();
          ctx.strokeStyle = rgba(T.c2, 0.08 + glow * 0.5);
          ctx.lineWidth = Math.max(1, U / 600);
          ctx.stroke();
          if (glow > 0.3) { ctx.fillStyle = rgba(T.c3, glow * 0.18); ctx.fill(); }
        }
      }
    },
  };

  // ---------- Style « aurore » : voiles de lumière qui ondulent en haut de l'écran ----------
  const Aurore = {
    single: true, count: 1,
    make() { return {}; },
    draw(_, dt, t) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      COLORS.forEach((c, k) => {
        const g = ctx.createLinearGradient(0, 0, 0, H * 0.8);
        g.addColorStop(0, rgba(c, 0)); g.addColorStop(0.45, rgba(c, 0.26)); g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += W / 60) {
          const y = H * (0.18 + k * 0.1) + Math.sin(x / W * 4 + t * (0.3 + k * 0.12) + k * 2) * H * 0.08
                  + Math.sin(x / W * 11 - t * 0.5) * H * 0.02;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      });
      ctx.restore();
    },
  };

  // ---------- Style « synthwave » : soleil rayé et grille en perspective qui défile ----------
  const Synthwave = {
    single: true, count: 1,
    make() { return {}; },
    draw(_, dt, t) {
      const hz = H * 0.58, cx = W / 2, R = U * 0.26;
      const sg = ctx.createLinearGradient(0, hz - R * 2, 0, hz);
      sg.addColorStop(0, T.c1); sg.addColorStop(1, T.c3);
      ctx.save(); ctx.beginPath(); ctx.arc(cx, hz - R * 0.35, R, 0, 7); ctx.clip();
      ctx.fillStyle = sg; ctx.fillRect(cx - R, hz - R * 1.4, R * 2, R * 2);
      ctx.fillStyle = T.bg2;
      for (let i = 0; i < 7; i++) { const y = hz - R * 0.6 + i * R * 0.13, h = R * 0.012 * (i + 1); ctx.fillRect(cx - R, y, R * 2, h); }
      ctx.restore();
      ctx.fillStyle = T.bg2; ctx.fillRect(0, hz, W, H - hz);
      ctx.strokeStyle = rgba(T.c2, 0.7); ctx.lineWidth = Math.max(1, U / 500);
      for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(cx + i * W * 0.012, hz); ctx.lineTo(cx + i * W * 0.16, H); ctx.stroke(); }
      const off = (t * 0.6) % 1;
      for (let i = 0; i < 14; i++) {
        const z = (i + off) / 14, y = hz + (H - hz) * z * z;
        ctx.strokeStyle = rgba(T.c2, 0.15 + z * 0.6); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      const hg = ctx.createLinearGradient(0, hz - U * 0.03, 0, hz + U * 0.03);
      hg.addColorStop(0, rgba(T.c3, 0)); hg.addColorStop(0.5, rgba(T.c3, 0.5)); hg.addColorStop(1, rgba(T.c3, 0));
      ctx.fillStyle = hg; ctx.fillRect(0, hz - U * 0.03, W, U * 0.06);
    },
  };

  // ---------- Style « reseau » : points reliés entre eux, façon constellation ----------
  const Reseau = {
    count: 95,
    make(anywhere) {
      return { x: rand(0, W), y: rand(0, H), vx: rand(-0.04, 0.04) * U / 1000, vy: rand(-0.04, 0.04) * U / 1000, color: pick(COLORS) };
    },
    draw(p, dt) {
      p.x = (p.x + p.vx * dt + W) % W; p.y = (p.y + p.vy * dt + H) % H;
      const lim = U * 0.2;
      for (const o of items) {
        if (o === p || o.x < p.x) continue;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        if (d < lim) { ctx.strokeStyle = rgba(p.color, (1 - d / lim) * 0.6); ctx.lineWidth = Math.max(1, U / 700); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(o.x, o.y); ctx.stroke(); }
      }
      ctx.fillStyle = rgba(p.color, 0.95); ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, U / 280), 0, 7); ctx.fill();
    },
  };

  // ---------- Style « bokeh » : grosses bulles de lumière floues ----------
  const Bokeh = {
    count: 34,
    make(anywhere) {
      return { x: rand(0, W), y: anywhere ? rand(0, H) : H + U * 0.2, r: U * rand(0.03, 0.14), vy: -rand(0.02, 0.08) * U / 1000,
        color: pick(COLORS), a: rand(0.12, 0.34), ph: rand(0, 6.3) };
    },
    draw(b, dt, t) {
      b.y += b.vy * dt; if (b.y < -b.r * 2) Object.assign(b, this.make(false));
      const a = b.a * (0.7 + 0.3 * Math.sin(t + b.ph));
      const g = ctx.createRadialGradient(b.x, b.y, b.r * 0.2, b.x, b.y, b.r);
      g.addColorStop(0, rgba(b.color, a)); g.addColorStop(0.8, rgba(b.color, a * 0.7)); g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    },
  };

  // ---------- Style « circuit » : pistes de carte électronique parcourues d'impulsions ----------
  const Circuit = {
    count: 34,
    make() {
      const g = U / 18, pts = [];
      let x = Math.round(rand(0, W) / g) * g, y = Math.round(rand(0, H) / g) * g;
      pts.push([x, y]);
      for (let i = 0; i < 5; i++) {
        const dir = Math.floor(rand(0, 4)), l = g * Math.ceil(rand(1, 5));
        if (dir === 0) x += l; else if (dir === 1) x -= l; else if (dir === 2) y += l; else { x += l; y += l; }
        pts.push([x, y]);
      }
      let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      return { pts, len, color: pick(COLORS), ph: rand(0, 1), sp: rand(0.15, 0.4) };
    },
    draw(c, dt, t) {
      ctx.strokeStyle = rgba(c.color, 0.14); ctx.lineWidth = Math.max(1, U / 700);
      ctx.beginPath(); c.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      ctx.fillStyle = rgba(c.color, 0.35);
      for (const [x, y] of [c.pts[0], c.pts[c.pts.length - 1]]) { ctx.beginPath(); ctx.arc(x, y, U / 260, 0, 7); ctx.fill(); }
      let d = ((t * c.sp + c.ph) % 1) * c.len;
      for (let i = 1; i < c.pts.length; i++) {
        const [ax, ay] = c.pts[i - 1], [bx, by] = c.pts[i], s = Math.hypot(bx - ax, by - ay);
        if (d <= s) {
          const k = d / s, x = ax + (bx - ax) * k, y = ay + (by - ay) * k;
          const g = ctx.createRadialGradient(x, y, 0, x, y, U / 60);
          g.addColorStop(0, rgba(c.color, 0.9)); g.addColorStop(1, rgba(c.color, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, U / 60, 0, 7); ctx.fill();
          break;
        }
        d -= s;
      }
    },
  };

  // ---------- Style « tunnel » : anneaux qui foncent vers la caméra ----------
  const Tunnel = {
    single: true, count: 1,
    make() { return {}; },
    draw(_, dt, t) {
      const cx = W / 2 + Math.sin(t * 0.4) * U * 0.05, cy = H / 2 + Math.cos(t * 0.3) * U * 0.04, n = 18;
      for (let i = 0; i < n; i++) {
        const z = ((i / n) + t * 0.12) % 1, r = Math.pow(z, 2.2) * Math.max(W, H) * 0.9;
        const sides = 6, rot = t * 0.2 + z * 1.5;
        ctx.strokeStyle = rgba(COLORS[i % 3], z * 0.55); ctx.lineWidth = Math.max(1, z * U / 120);
        ctx.beginPath();
        for (let k = 0; k <= sides; k++) { const a = rot + k / sides * Math.PI * 2; const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    },
  };

  // ---------- Style « minimal » : rien de plus que le fond + un halo qui se déplace ----------
  const Minimal = { count: 0, make() { return {}; }, draw() {} };

  const STYLES = { formes: Formes, bandes: Bandes, braises: Braises, vagues: Vagues, etoiles: Etoiles, pluie: Pluie, hexa: Hexa, aurore: Aurore, synthwave: Synthwave, reseau: Reseau, bokeh: Bokeh, circuit: Circuit, tunnel: Tunnel, minimal: Minimal };
  const style = STYLES[ANIM] || Formes;

  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight; U = Math.min(W, H);
    const scale = style === Vagues || style.single ? 1 : (W * H) / (1920 * 1080);
    const count = style.single ? 1 : Math.round(style.count * DENSITY * scale);
    items = [];
    for (let i = 0; i < count; i++) items.push(style.make(true, i));
  }

  function cornerBand(p, corner, offset, thick, color) {
    const k = 2, slide = (1 - Math.min(1, p)) * U * 0.54;
    const c0 = (offset + slide) * U / 1080, c1 = c0 + thick * U / 1080;
    ctx.fillStyle = color; ctx.beginPath();
    if (corner === "bl") { ctx.moveTo(0, H - c0 / k); ctx.lineTo(c0, H); ctx.lineTo(c1, H); ctx.lineTo(0, H - c1 / k); }
    else { ctx.moveTo(W, c0 / k); ctx.lineTo(W - c0, 0); ctx.lineTo(W - c1, 0); ctx.lineTo(W, c1 / k); }
    ctx.closePath(); ctx.fill();
  }

  let streaks = [], nextStreak = 0;
  const t0 = performance.now();
  let last = t0;

  function frame(now) {
    const t = (now - t0) / 1000 * SPEED;
    const dt = Math.min(50, now - last) * SPEED; last = now;

    // fond : dégradé du thème + halo qui respire et dérive
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.bg1); g.addColorStop(1, T.bg2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const hx = W * (0.5 + Math.sin(t * 0.15) * (ANIM === "minimal" ? 0.3 : 0.08));
    const rg = ctx.createRadialGradient(hx, H * 0.55, 0, hx, H * 0.55, Math.max(W, H) * 0.6);
    rg.addColorStop(0, rgba(T.c3, 0.16 + Math.sin(t * 0.6) * 0.04)); rg.addColorStop(1, rgba(T.c3, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    if (on("traits")) {
      ctx.strokeStyle = rgba(T.c2, 0.1);
      ctx.lineWidth = Math.max(1, U / 900);
      const gap = U / 14, shift = (t * U * 0.03) % gap;
      for (let x = -H + shift; x < W + H; x += gap) { ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H * .6, 0); ctx.stroke(); }
    }

    for (const it of items) style.draw(it, dt, t);

    if (on("eclairs")) {
      if (t > nextStreak) {
        streaks.push({ y: rand(0, H), born: t, len: U * rand(0.2, 0.5), color: Math.random() < .5 ? T.c1 : T.c2 });
        nextStreak = t + rand(1.5, 4);
      }
      streaks = streaks.filter(s => t - s.born < 1.2);
      for (const s of streaks) {
        const x = -s.len + (t - s.born) / 1.2 * (W + s.len * 2);
        const lg = ctx.createLinearGradient(x, 0, x + s.len, 0);
        lg.addColorStop(0, rgba(s.color, 0)); lg.addColorStop(1, rgba(s.color, 0.55));
        ctx.save(); ctx.translate(0, s.y); ctx.rotate(-0.46); ctx.translate(0, -s.y);
        ctx.fillStyle = lg; ctx.fillRect(x, s.y, s.len, Math.max(2, U / 400)); ctx.restore();
      }
    }

    if (on("bandes")) {
      const p = Math.min(1, t / 1.4), wob = Math.sin(t * 0.9) * 6;
      for (const corner of ["bl", "tr"]) {
        cornerBand(p, corner, 250 + wob, 70, T.c2);
        cornerBand(p, corner, 350 + wob * 1.4, 22, T.c3);
        cornerBand(p, corner, 400 + wob * 1.8, 8, rgba(T.c2, 0.6));
      }
    }

    if (on("grain")) {
      ctx.save(); ctx.fillStyle = ctx.createPattern(grainTile, "repeat");
      ctx.translate(rand(0, 256), rand(0, 256)); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, U * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.7)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  grainTile = makeGrain();
  resize();
  addEventListener("resize", resize);
  requestAnimationFrame(frame);
</script>
</body>
</html>
